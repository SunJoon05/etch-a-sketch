<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Etch-a-Sketch</title>
  </head>
  <body>
    <div class="main_container_sketch">
      <div class="container_grid_elements"></div>
      <div class="container_grid_information">
        <div class="container_title">
          <h1 class="main_title">Etch a Sketch</h1>
        </div>
        <div class="information_container">
          <ul class="information_unordered_list">
            <li class="indication">1. Select the size</li>
            <li class="indication">2. Select the size</li>
            <li class="indication">3. Click and drag to paint</li>
          </ul>
        </div>
        <div class="container_grid_actions">
          <div class="container_indications">
            <span class="text_info">Clear grid</span>
            <hr class="separator" />
            <span class="text_info">Check boxes</span>
            <hr class="separator" />
            <span class="text_info">Select color</span>
          </div>

          <button class="clean_btn action">
            <span class="clean_btn_text">Clean</span>
          </button>

          <input
            class="grid_size action"
            type="number"
            min="1"
            max="100"
            value="16"
          />

          <span class="color_picker_container action">
            <input class="color_picker" type="color" />
          </span>
        </div>
      </div>
    </div>
    <script type="module" src="script.js"></script>
  </body>
</html>
